# ==== Gradle 基础 ====
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ==== 本机环境配置（其他机器请按 ../local.md 修改）====
# 便携 JDK 21 作为 Gradle JVM 与编译工具链；路径含空格，须用正斜杠
org.gradle.java.home=D:/Common Project/MC Genshin mod/.tools/jdk-21
# 本机代理：maven.neoforged.net 等域名直连不可达
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=9674
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=9674

# ==== Minecraft / NeoForge 版本 ====
# 与 Game_MC 运行环境保持一致：1.21.1 + NeoForge 21.1.265
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
# FML loader 主版本区间，MDK 默认 [1,)
loader_version_range=[1,)

# ==== Mod 元信息 ====
mod_id=teyvat_elements
mod_name=Teyvat Elements
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.teyvat.elements
